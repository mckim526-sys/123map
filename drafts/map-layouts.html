<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관계도 배치 시안 — 12·3 재판 지도</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="../v2/css/tokens.css">
<style>
/* 관계도 배치 시안: 방사형 대신 사각형 공간을 채우는 두 가지 (실제 재판 데이터 · 정지 화면) */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-page); color: var(--text-primary); font-family: var(--font); -webkit-font-smoothing: antialiased; word-break: keep-all; }
.top { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--border-default); }
.top b { font-size: 15px; font-weight: 800; }
.top nav { display: flex; gap: 6px; margin-left: 12px; }
.top nav a { height: 32px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border-default); font-size: 13px; font-weight: 600; color: var(--text-secondary); text-decoration: none; }
.top nav a.on { background: var(--gray-900); border-color: var(--gray-900); color: #fff; }
.top .who { margin-left: auto; display: flex; gap: 6px; }
.top .who a { font-size: 12px; color: var(--text-tertiary); }
.stage { position: relative; height: calc(100vh - 56px); padding: 16px 20px 20px; }
.card { position: relative; height: 100%; border: 1px solid var(--border-default); border-radius: 16px; background: var(--bg-subtle); overflow: hidden; }
.card-head { display: flex; align-items: baseline; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border-default); background: var(--bg-page); }
.card-head h1 { margin: 0; font-size: 17px; font-weight: 800; }
.card-head span { font-size: 12px; color: var(--text-tertiary); }
.area { position: absolute; inset: 46px 0 0 0; }
svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
svg.links path { fill: none; stroke: #b9c6ee; stroke-width: 1.5; }
svg.links path.sep { stroke-dasharray: 4 5; stroke: #c9cfd8; }
/* 아바타 */
.ava { --s: 36px; position: relative; display: inline-grid; place-items: center; width: var(--s); height: var(--s); border-radius: 50%; overflow: hidden; background: var(--gray-200, #e6e8ec); flex: none; }
.ava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ava__ini { font-size: calc(var(--s) * .3); font-weight: 700; color: var(--gray-700); }
/* 가운데(중심) 인물 */
.hub { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; z-index: 2; }
.hub .ava { --s: 84px; box-shadow: 0 0 0 4px var(--bg-subtle), 0 0 0 6px var(--accent), var(--shadow-2); }
.hub b { font-size: 20px; font-weight: 800; }
.hub small { font-size: 12px; color: var(--text-tertiary); line-height: 1.5; }
/* 사건 상자 */
.box { position: relative; z-index: 1; border: 1px solid var(--border-default); border-radius: 12px; background: var(--bg-page); padding: 9px 10px 10px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
.box.is-on { border-color: var(--gray-900); box-shadow: 0 0 0 1px var(--gray-900); }
.box h3 { display: flex; align-items: baseline; gap: 6px; margin: 0 0 8px; font-size: 13px; font-weight: 800; line-height: 1.3; }
.box h3 em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--text-tertiary); }
.box h3 i { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.ppl { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px 4px; }
.pp { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.pp .ava { --s: 34px; box-shadow: 0 0 0 2px var(--bg-page), 0 0 0 3px var(--accent); }
.pp.sep .ava { --s: 28px; box-shadow: 0 0 0 2px var(--bg-page), 0 0 0 3px #c9cfd8; }
.pp b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; font-weight: 700; color: var(--blue-700, #1d3faa); }
.pp.sep b { font-weight: 500; color: var(--text-secondary); }
.solo-list { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px; }
.solo-list li { padding: 2px 8px; border: 1px dashed var(--border-strong); border-radius: 999px; font-size: 11.5px; color: var(--text-secondary); }
.box.solo, .box.other { background: #fbfbfc; }
/* A안: 사건 묶음판 — 왼쪽 중심 인물, 오른쪽을 상자로 빽빽하게 (세로 기둥 여러 개) */
.A .hub { left: 0; top: 0; bottom: 0; width: 190px; justify-content: center; border-right: 1px solid var(--border-default); background: var(--bg-page); }
.A .board { position: absolute; left: 214px; right: 14px; top: 14px; bottom: 14px; columns: 3 230px; column-gap: 12px; }
.A .board .box { break-inside: avoid; margin-bottom: 12px; }
/* B안: 좌우 가지형 — 가운데 중심 인물, 양옆 기둥에 상자 */
.B .hub { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 180px; }
.B .side { position: absolute; top: 14px; bottom: 14px; width: calc(50% - 130px); display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.B .side.l { left: 14px; } .B .side.r { right: 14px; }
.B .side .box { flex: none; }
.legend { position: absolute; left: 18px; bottom: 6px; font-size: 11px; color: var(--text-tertiary); display: none; }
</style>
</head>
<body>
<header class="top"><b>관계도 배치 시안</b>
  <nav><a href="?v=a" id="ta">A · 사건 묶음판</a><a href="?v=b" id="tb">B · 좌우 가지형</a></nav>
  <div class="who"><a href="?v=a&c=yoon">윤석열 중심</a> · <a href="?v=a&c=keon">김건희 중심</a> · <a href="?v=a&c=kim">김용현 중심</a></div>
</header>
<main class="stage"><div class="card">
  <div class="card-head"><h1>인물·사건 연결 지도</h1><span id="ctx"></span></div>
  <div class="area" id="area"><svg class="links" id="links"></svg></div>
</div></main>
<script src="../v2/js/config.js"></script>
<script src="../reader-data.js"></script>
<script src="../v2/js/util.js"></script>
<script src="../v2/js/model.js"></script>
<script>
// 디자인 확인용 정지 화면 — 실제 데이터로 '사건별 무리'를 만들어 두 가지 배치로 그림 (누르기 등 기능 없음)
(function () {
  const q = new URLSearchParams(location.search), V = q.get('v') === 'b' ? 'B' : 'A', C = Model.get(q.get('c') || 'yoon');
  document.getElementById(V === 'A' ? 'ta' : 'tb').classList.add('on');
  document.querySelectorAll('.who a').forEach(a => a.href = a.href.replace(/v=a/, 'v=' + V.toLowerCase()));
  // 사건별 무리 (지금 관계도의 caseLayout과 같은 규칙: 한 사람은 첫 무리에만)
  const placed = new Set(), groups = [];
  const cases = C.records.map(r => ({ r, co: [...Model.trialmates(C, r)], sep: Model.separateTrial(C, r) }))
    .sort((a, b) => (b.co.length + b.sep.length) - (a.co.length + a.sep.length));
  const coAll = new Set(cases.flatMap(c => c.co));
  const solo = [];
  cases.forEach(c => {
    const co = c.co.filter(id => !placed.has(id)), sep = c.sep.filter(id => !coAll.has(id) && !placed.has(id));
    [...co, ...sep].forEach(id => placed.add(id));
    if (!c.co.length && !c.sep.length) return solo.push(c.r);
    groups.push({ r: c.r, co: co.map(Model.get), sep: sep.map(Model.get), total: c.co.length });
  });
  const others = Model.people.filter(p => p.id !== C.id && !placed.has(p.id) && Model.linkLabel(C, p, 'all'));
  const person = (p, cls = '') => `<div class="pp ${cls}">${avatar(p)}<b>${esc(p.name)}</b></div>`;
  const box = g => `<section class="box" data-k="${esc(g.r.id)}"><h3>${esc(String(g.r.label).split(' · ')[0])} <em>${esc(g.r.agency)}</em><i>${g.total ? '함께 ' + g.total + '명' : '별도 재판'}</i></h3>
      <div class="ppl">${g.co.map(p => person(p)).join('')}${g.sep.map(p => person(p, 'sep')).join('')}</div></section>`;
  const soloBox = solo.length ? `<section class="box solo" data-k="solo"><h3>단독 재판 <em>${solo.length}건</em></h3><ul class="solo-list">${solo.map(r => `<li>${esc(String(r.label).split(' · ')[0])}</li>`).join('')}</ul></section>` : '';
  const otherBox = others.length ? `<section class="box other" data-k="other"><h3>그 밖의 관계 <em>${others.length}명</em></h3><div class="ppl">${others.map(p => person(p, 'sep')).join('')}</div></section>` : '';
  const boxes = [...groups.map(box), soloBox, otherBox].filter(Boolean);
  const hub = `<div class="hub">${avatar(C)}<b>${esc(C.name)}</b><small>${esc(C.role || '')}<br>사건 ${C.records.length}건 · 연결 ${placed.size + others.length}명</small></div>`;
  const area = document.getElementById('area');
  area.classList.add(V);
  if (V === 'A') area.insertAdjacentHTML('beforeend', hub + `<div class="board">${boxes.join('')}</div>`);
  else {
    // 좌우 기둥: 사람 수가 비슷하도록 번갈아 나눔
    const weight = s => (s.match(/class="pp/g) || []).length + 2, L = [], R = [];
    let wl = 0, wr = 0; boxes.forEach(b => { if (wl <= wr) { L.push(b); wl += weight(b); } else { R.push(b); wr += weight(b); } });
    area.insertAdjacentHTML('beforeend', `<div class="side l">${L.join('')}</div>` + hub + `<div class="side r">${R.join('')}</div>`);
  }
  document.getElementById('ctx').textContent = `${C.name} 중심 · 사건 ${C.records.length}건 · 함께 재판 ${coAll.size}명 · 배치 시안 ${V === 'A' ? 'A 사건 묶음판' : 'B 좌우 가지형'}`;
  // 연결선: 중심 인물 → 각 상자
  function links() {
    if (V === 'A') return; // A안은 왼쪽 인물 → 오른쪽 상자로 읽혀 선 없이 (상자 사이를 지나는 선이 오히려 어지러움)
    const a = area.getBoundingClientRect(), h = area.querySelector('.hub .ava').getBoundingClientRect(), svg = document.getElementById('links');
    const hx = h.left + h.width / 2 - a.left, hy = h.top + h.height / 2 - a.top;
    svg.innerHTML = [...area.querySelectorAll('.box')].map(b => {
      const r = b.getBoundingClientRect(), left = r.left - a.left > hx;
      const x = left ? r.left - a.left : r.right - a.left, y = r.top - a.top + Math.min(22, r.height / 2);
      const sx = V === 'A' ? 190 : hx + (left ? 46 : -46), sy = V === 'A' ? hy : hy;
      const mx = (sx + x) / 2;
      return `<path class="${b.classList.contains('solo') || b.classList.contains('other') ? 'sep' : ''}" d="M${sx} ${sy} C${mx} ${sy}, ${mx} ${y}, ${x} ${y}"/>`;
    }).join('');
  }
  addEventListener('load', links); addEventListener('resize', links); setTimeout(links, 300);
})();
</script>
</body>
</html>
